<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>GBEMU (Zig WebAssembly)</title>
  <style>
    body { font-family: system-ui, sans-serif; background:#111; color:#eee; display:flex; flex-direction:column; align-items:center; gap:1rem; margin:0; padding:1rem; }
    #screen { image-rendering: pixelated; background:#222; }
    #log { white-space: pre; font-size: 12px; max-height:200px; overflow:auto; background:#000; padding:0.5rem; width:100%; box-sizing:border-box; }
    .controls { display:flex; gap:1rem; align-items:center; }
  </style>
</head>
<body>
  <h1>GBEMU</h1>
  <div class="controls">
    <input type="file" id="romfile" accept=".gb,.gbc" />
    <button id="pauseBtn" disabled>Pause</button>
  </div>
  <canvas id="screen" width="160" height="144"></canvas>
  <div id="log"></div>
  <script type="module" src="emu.js"></script>
</body>
</html>
